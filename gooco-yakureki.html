<title>GooCo薬歴飛ばない</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>
:root {
  --pri: #1a6b75;
  --pri-light: #e3f2f4;
  --surface: #f5f9fa;
  --card: #ffffff;
  --text: #1b2c32;
  --text2: #6b7f87;
  --border: #d5e0e3;
  --hdr-a: #1a6b75;
  --hdr-b: #2a8690;
  --shadow: 0 2px 8px rgba(26,107,117,0.10);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --pri:#5cc4d0;--pri-light:#152c31;
    --surface:#0b181c;--card:#12252b;--text:#cde0e5;
    --text2:#6a8590;--border:#243a42;
    --hdr-a:#0e3a42;--hdr-b:#175560;
    --shadow:0 2px 8px rgba(0,0,0,0.25);
  }
}
:root[data-theme="dark"]{
  --pri:#5cc4d0;--pri-light:#152c31;
  --surface:#0b181c;--card:#12252b;--text:#cde0e5;
  --text2:#6a8590;--border:#243a42;
  --hdr-a:#0e3a42;--hdr-b:#175560;
  --shadow:0 2px 8px rgba(0,0,0,0.25);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",sans-serif;
  background:var(--surface);color:var(--text);
  max-width:480px;margin:0 auto;
  -webkit-text-size-adjust:100%;
}
.hdr{
  background:linear-gradient(135deg,var(--hdr-a),var(--hdr-b));
  color:#fff;padding:12px 14px;
  display:flex;align-items:center;gap:10px;
}
.back-btn{
  width:36px;height:36px;border-radius:8px;
  background:rgba(255,255,255,.15);border:none;color:#fff;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;font-size:20px;
  text-decoration:none;
}
.back-btn:active{background:rgba(255,255,255,.25)}
.hdr-title{font-size:17px;font-weight:700}
.hdr-icon{font-size:20px}

.content{padding:16px 14px}
.video-card{
  background:var(--card);border-radius:12px;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  overflow:hidden;margin-bottom:16px;
}
.video-wrap{
  position:relative;
  width:100%;
  padding-bottom:56.25%;
  background:#000;
}
.video-wrap iframe{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  border:none;
}
.video-info{
  padding:14px 16px;
}
.video-title{
  font-size:16px;font-weight:700;
  margin-bottom:6px;
}
.video-desc{
  font-size:13px;color:var(--text2);
  line-height:1.6;
}
</style>

<div class="hdr">
  <a href="index.html" class="back-btn">←</a>
  <span class="hdr-icon">📡</span>
  <span class="hdr-title">GooCo薬歴飛ばない</span>
</div>

<div class="content">
  <div class="video-card">
    <div class="video-wrap">
      <iframe src="https://drive.google.com/file/d/1N8SUtZRz3Hzyy17KClV6qGYpOz5zhL8x/preview" allow="autoplay" allowfullscreen></iframe>
    </div>
    <div class="video-info">
      <div class="video-title">GooCo薬歴が飛ばないときの対処法</div>
      <div class="video-desc">薬歴データが送信できない場合の復旧手順を動画で確認できます。</div>
    </div>
  </div>
</div>
